server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required for React Router / client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed CRA assets can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}